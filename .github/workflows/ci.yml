name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show tool versions
        run: |
          bash --version | head -1
          shellcheck --version
          wget --version | head -1

      - name: Lint
        run: make lint

      - name: Test
        run: make test
